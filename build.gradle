plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+fabric1.21.1"
group = project.mod_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.8.3"
    implementation "com.electronwill.night-config:toml:3.8.1"
    implementation "com.electronwill.night-config:core:3.8.1"
    include "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:core:3.8.1"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        jeg {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property "version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

// Exercise the vehicle OBB ray/contact assertions on this module's mapped runtime classpath.
tasks.register('checkVehicleGeometry', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ttv.migami.jeg.vehicle.util.VehicleGeometry'
    jvmArgs '-ea'
}

// Small assertion checks for SW component recovery, save migration and damage-rule parsing.
tasks.register('checkVehicleDamage', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ttv.migami.jeg.vehicle.data.subdata.VehicleDamageProfile'
    jvmArgs '-ea'
}
tasks.register('checkVehicleDamageModifiers', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ttv.migami.jeg.vehicle.data.subdata.DamageModifierInfo'
    jvmArgs '-ea'
}
tasks.named('check') {
    dependsOn 'checkVehicleGeometry', 'checkVehicleDamage', 'checkVehicleDamageModifiers'
tasks.register('checkMagazineMode', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ttv.migami.jeg.gun.MagazineModeRules'
    jvmArgs '-ea'
}

}
    dependsOn tasks.named('checkMagazineMode')
